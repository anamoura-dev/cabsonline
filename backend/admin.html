<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CabsOnline - Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>CabsOnline Admin</h1>
        <p>Search for a booking reference number or leave blank to view unassigned bookings within 2 hours.</p>

        <div class="form-group">
            <label for="bsearch">Booking Reference Number (optional)</label>
            <input type="text" id="bsearch" name="bsearch">
        </div>

        <div class="form-group">
            <button type="button" id="searchBooking" name="sbutton">Search Booking</button>
        </div>

        <p id="adminMessage" class="message"></p>

        <div class="content" id="result">
            <!-- Results will be dynamically populated here -->
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
