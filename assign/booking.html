<!DOCTYPE html>

    File: booking.html
    Description: Booking page for CabsOnline. Allows passengers to enter
    taxi booking details and submit them for server-side processing.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CabsOnline - Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>CabsOnline - Book a Taxi</h1>

        <form id="booking-form" method="POST">
            <div class="form-row">
                <label>Customer Name <span class="required">*</span>
                    <input type="text" name="cname" required>
                </label>
                <label>Phone Number <span class="required">*</span>
                    <input type="text" name="phone" required>
                </label>
            </div>

            <div class="form-row">
                <label>Street Number <span class="required">*</span>
                    <input type="text" name="snumber" required>
                </label>
                <label>Street Name <span class="required">*</span>
                    <input type="text" name="stname" required>
                </label>
            </div>

            <div class="form-row">
                <label>Unit Number
                    <input type="text" name="unumber">
                </label>
                <label>Suburb
                    <input type="text" name="sbname">
                </label>
            </div>

            <div class="form-row">
                <label>Destination Suburb
                    <input type="text" name="dsbname">
                </label>
            </div>

            <div class="form-row">
                <label>Pick-Up Date <span class="required">*</span>
                    <input type="date" name="date" id="pickup-date" required>
                </label>
                <label>Pick-Up Time <span class="required">*</span>
                    <input type="time" name="time" id="pickup-time" required>
                </label>
            </div>

            <button type="submit">Book Taxi</button>
        </form>

        <div id="reference-container">
            <p id="reference"></p>
        </div>
    </div>

    <script src="booking.js"></script>
</body>
</html>
